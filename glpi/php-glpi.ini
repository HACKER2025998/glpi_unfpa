; ================================================
; Configuration PHP — GLPI UNFPA Togo
; ================================================

; ---- LE CORRECTIF ESSENTIEL ----
; Sans php.ini, PHP active display_errors par defaut : les warnings
; s'impriment dans la page AVANT les en-etetes HTTP, ce qui provoque
; la cascade de "headers already sent" et casse l'affichage de GLPI.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/glpi_php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE

; ---- Ressources ----
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
upload_max_filesize = 20M
post_max_size = 20M

; ---- Sessions ----
session.cookie_httponly = On
session.use_strict_mode = On
session.cookie_samesite = Lax
session.auto_start = Off

; ---- Divers ----
date.timezone = Africa/Lome
expose_php = Off

; ---- OPcache ----
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
