# ================================================
# Configuration Apache — GLPI UNFPA Togo
# Les regles de reecriture sont DANS le vhost :
# aucune dependance au .htaccess ni a AllowOverride.
# ================================================

<VirtualHost *:80>
    ServerName glpi.unfpa-togo.local
    ServerAlias *
    DocumentRoot /var/www/html/glpi/public

    <Directory /var/www/html/glpi/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Indispensable pour l'API REST : conserve l'en-tete Authorization
        RewriteCond %{HTTP:Authorization} ^(.+)$
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%1]

        # Route toute requete qui ne correspond pas a un fichier reel
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ index.php [QSA,L]

        <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "SAMEORIGIN"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
        </IfModule>
    </Directory>

    # Les repertoires sensibles ne doivent jamais etre servis
    <DirectoryMatch "^/var/www/html/glpi/(config|files|install/mysql)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/glpi_error.log
    CustomLog ${APACHE_LOG_DIR}/glpi_access.log combined
    LogLevel  warn
</VirtualHost>
